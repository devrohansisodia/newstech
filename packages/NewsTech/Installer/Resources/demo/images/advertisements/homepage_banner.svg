<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
<title id="title">City Bank campaign banner</title>
<desc id="desc">Installer demo advertisement banner.</desc>
<defs>
<linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
<stop offset="0%" stop-color="#0f172a"/>
<stop offset="100%" stop-color="#1d4ed8"/>
</linearGradient>
</defs>
<rect width="1200" height="300" rx="28" fill="url(#bg)"/>
<circle cx="1020" cy="110" r="110" fill="#60a5fa" opacity="0.22"/>
<circle cx="920" cy="220" r="140" fill="#93c5fd" opacity="0.18"/>
<text x="80" y="118" fill="#f8fafc" font-size="28" font-family="Arial, sans-serif" letter-spacing="6">PARTNER CAMPAIGN</text>
<text x="80" y="172" fill="#ffffff" font-size="64" font-family="Arial, sans-serif" font-weight="700">City Bank Growth</text>
<text x="80" y="214" fill="#dbeafe" font-size="24" font-family="Arial, sans-serif">Flexible funding for expanding local businesses.</text>
<rect x="80" y="238" width="190" height="36" rx="18" fill="#f59e0b"/>
<text x="117" y="262" fill="#111827" font-size="18" font-family="Arial, sans-serif" font-weight="700">Learn More</text>
</svg>
